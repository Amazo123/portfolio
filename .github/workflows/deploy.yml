name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Free hosting path #1: GitHub Pages on the project URL
# https://amazo123.github.io/portfolio/  (build sets SITE_URL/SITE_BASE
# so canonical, OG and sitemap URLs all match the deployed location).
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://amazo123.github.io
          SITE_BASE: /portfolio
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
